<div class="search-wrapper">

    <form method="get"
          class="search-form"
          id="searchForm">

        {{ search_form.q }}

        <button type="submit" class="search-btn">
            <i class="bi bi-search"></i>
        </button>

    </form>

    <div class="search-info-grid">

        <div class="search-info-card">
            <div class="info-icon">
                <i class="bi bi-shield-check"></i>
            </div>

            <div>
                <h4>Anúncios verificados</h4>
                <p>Mais segurança para você</p>
            </div>
        </div>

        <div class="search-info-card">
            <div class="info-icon">
                <i class="bi bi-headset"></i>
            </div>

            <div>
                <h4>Atendimento rápido</h4>
                <p>Fale direto com o vendedor</p>
            </div>
        </div>

        <div class="search-info-card">
            <div class="info-icon">
                <i class="bi bi-grid"></i>
            </div>

            <div>
                <h4>Diversas categorias</h4>
                <p>Encontre o que precisa</p>
            </div>
        </div>

        <div class="search-info-card">
            <div class="info-icon">
                <i class="bi bi-person"></i>
            </div>

            <div>
                <h4>Melhores preços</h4>
                <p>Compare e escolha</p>
            </div>
        </div>

    </div>

</div>
